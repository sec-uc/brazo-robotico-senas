        <title id="grafica-motores-title">Reconocimiento de voz: latencia de software (p95) por motor</title>
        <desc id="grafica-motores-desc">Barras horizontales con el percentil 95 de la latencia de software de tres motores de reconocimiento de voz en CPU, con su intervalo de confianza del 95 % y la meta de 1 500 ms: solo faster-whisper base (584 ms) la cumple.</desc>
