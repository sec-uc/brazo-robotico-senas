        <title id="grafica-concurrencia-title">Rendimiento con sesiones de texto simultáneas</title>
        <desc id="grafica-concurrencia-desc">Gráfico de líneas con las sesiones de texto completadas por segundo para 1, 2, 4, 8, 16 y 32 sesiones simultáneas, antes y después de la ADR-009, medido en un solo equipo y sin fallos en ninguna de las dos series.</desc>
