      #grafica-concurrencia-root { font-family: var(--font-sans); color: var(--color-ink); }
      #grafica-concurrencia-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#grafica-concurrencia-root .diagram-container { overflow-x: visible; }
}</style>
