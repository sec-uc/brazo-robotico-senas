        <text x="1000" y="390" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace"><tspan fill="#2d3142">stt</tspan><tspan x="1064" fill="#4f5d75">voice.text.transcribed</tspan></text>
        <text x="1000" y="406" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace"><tspan fill="#2d3142">nlp</tspan><tspan x="1064" fill="#4f5d75">nlp.gloss.sequence · glosas</tspan></text>
        <text x="1000" y="422" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace"><tspan fill="#2d3142">señas</tspan><tspan x="1064" fill="#4f5d75">signs.gesture.plan · ángulos</tspan></text>
        <text x="1000" y="438" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace"><tspan fill="#2d3142">actuadores</tspan><tspan x="1064" fill="#4f5d75">actuator.state</tspan></text>
        <text x="1064" y="454" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">accepted → executing → done</text>
