        <text x="668" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUBLICA AUDIO</text>
        <text x="668" y="322" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">voice.audio.chunk · 30 s</text>
