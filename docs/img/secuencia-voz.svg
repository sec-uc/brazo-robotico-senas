        <text x="800" y="564" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">La telemetría escucha</text>
        <text x="800" y="582" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">cada evento del bus</text>
