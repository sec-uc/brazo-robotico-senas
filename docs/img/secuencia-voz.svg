<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secuencia-voz-title secuencia-voz-desc" id="secuencia-voz-root">
        <title id="secuencia-voz-title">Una sesión de voz, de extremo a extremo</title>
        <desc id="secuencia-voz-desc">Diagrama de secuencia: la tableta crea la sesión y abre el flujo SSE en la pasarela, envía el audio, la captura de voz lo publica en el bus NATS, las etapas de reconocimiento, lingüística, señas y actuadores se encadenan por el bus, y la pasarela devuelve el plan y los estados a la tableta, que manda los ángulos al brazo por USB.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #secuencia-voz-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #secuencia-voz-root { font-family: var(--font-sans); color: var(--color-ink); }
      #secuencia-voz-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#secuencia-voz-root .diagram-container { overflow-x: visible; }
}</style>
