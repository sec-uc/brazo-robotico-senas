        <rect x="210" y="152" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="246" y="161" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SESSION_ID</text>
        <rect x="172" y="184" width="148" height="20" rx="2" fill="#f5f5f5"/>
        <text x="246" y="193" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ABRIR SSE</text>
