        <text x="462" y="273" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REENVÍO HTTP</text>
        <text x="462" y="282" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">audio WAV</text>
