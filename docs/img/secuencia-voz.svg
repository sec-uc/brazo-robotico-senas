        <circle cx="1104" cy="478" r="2" fill="#2d3142"/>
        <text x="1000" y="516" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Cada evento suma su marca a una</text>
        <text x="1000" y="534" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">traza acumulada; de ella sale</text>
        <text x="1000" y="552" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">la latencia de cada etapa:</text>
        <text x="1000" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">captured → transcribed → glossed →</text>
        <text x="1000" y="598" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">planned → accepted → executing → done</text>
