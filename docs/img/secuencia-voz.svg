        <text x="668" y="497" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PLAN Y ESTADOS</text>
        <text x="668" y="506" fill="#5a6580" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gesture.plan · actuator.state</text>
        <rect x="174" y="528" width="144" height="20" rx="2" fill="#f5f5f5"/>
        <text x="246" y="537" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVENTOS SSE</text>
