<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contexto del sistema</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1360px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }
    .sub { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · C4 nivel 1</p>
    <h1>Contexto del sistema</h1>
    <p class="sub">Quién usa la plataforma, con qué sistemas habla y por qué canal.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contexto-title contexto-desc">
        <title id="contexto-title">Contexto del sistema</title>
        <desc id="contexto-desc">Contexto de la Plataforma RSP: la persona usuaria habla o escribe en el cliente de la tableta, que envía la voz a la plataforma por HTTPS, recibe el plan de gestos por SSE y reenvía los ángulos al brazo robótico por USB; el equipo lingüístico mantiene el vocabulario por la API y el monitoreo recibe las métricas.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(0,-32)">
        <!-- Flechas -->
        <line x1="300" y1="356" x2="460" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="700" y1="340" x2="860" y2="340" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="860" y1="372" x2="700" y2="372" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <line x1="580" y1="400" x2="580" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1020" y1="192" x2="1020" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="1020" y1="400" x2="1020" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Etiquetas de flechas -->
        <rect x="344" y="336" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="345" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VOZ · TEXTO</text>
        <rect x="740" y="306" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="315" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO · TEXTO</text>
        <rect x="744" y="320" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="329" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS · JWT</text>
        <rect x="740" y="380" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="389" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SSE · EVENTOS</text>
        <rect x="736" y="394" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="403" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PLAN DE GESTOS</text>
        <rect x="588" y="450" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="628" y="459" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">USB · ÁNGULOS</text>
        <rect x="1028" y="246" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1064" y="255" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VOCABULARIO</text>
        <rect x="1028" y="450" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1056" y="459" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MÉTRICAS</text>
        <!-- Nodos -->
        <!-- Nodo: Persona usuaria -->
        <rect x="100" y="312" width="200" height="88" rx="6" fill="#f5f5f5"/>

        <rect x="108" y="320" width="44" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.50)" stroke-width="0.8"/>

        <rect x="460" y="312" width="240" height="88" rx="6" fill="#f5f5f5"/>

        <text x="580" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">envía la voz · reenvía ángulos</text>
        <!-- Nodo: Plataforma RSP -->
        <rect x="860" y="312" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="860" y="312" width="320" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="868" y="320" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="890" y="329" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SISTEMA</text>
        <text x="1020" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Plataforma RSP</text>
        <text x="1020" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">8 microservicios · Docker Compose</text>
        <text x="1020" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">un puerto público: la pasarela</text>
        <!-- Nodo: Equipo lingüístico / operador -->
        <rect x="880" y="112" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="880" y="112" width="280" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="888" y="120" width="56" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.50)" stroke-width="0.8"/>
        <text x="916" y="129" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPERACIÓN</text>
        <text x="1020" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Equipo lingüístico / operador</text>
        <text x="1020" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">mantiene el vocabulario de señas</text>
        <!-- Nodo: Brazo robótico -->
        <rect x="460" y="512" width="240" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="460" y="512" width="240" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="468" y="520" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="494" y="529" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARDWARE</text>
        <text x="580" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Brazo robótico</text>
        <text x="580" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">15 servos · firmware serie</text>
        <!-- Nodo: Monitoreo -->
        <rect x="920" y="512" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="920" y="512" width="200" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="928" y="520" width="80" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="968" y="529" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OBSERVABILIDAD</text>
        <text x="1020" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Monitoreo</text>
        <text x="1020" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Prometheus + Grafana</text>
        <text x="1020" y="582" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">solo desde el propio equipo</text>
        </g>
        <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <text x="193" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Aplicación cliente</text>
        <rect x="306" y="664" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="326" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Persona / equipo</text>
        <rect x="430" y="664" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="450" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Sistema externo</text>
        <line x1="549" y1="669" x2="577" y2="669" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="585" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Llamada HTTPS / API</text>
        <line x1="703" y1="669" x2="731" y2="669" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" stroke-dasharray="5,4"/>
        <text x="739" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Flujo SSE de retorno</text>
        <line x1="862" y1="669" x2="890" y2="669" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="898" y="672" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Flujo de datos</text>
      </svg>
    </div>
  </div>
</body>
</html>
