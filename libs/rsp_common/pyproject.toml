[project]
name = "rsp-common"
version = "0.1.0"
description = "Contratos de eventos, bus NATS y utilidades comunes de la Robot Signs Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "nats-py>=2.7",
  "prometheus-client>=0.19",
  "PyJWT>=2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rsp_common*"]
